---
networks:
  ollama-network:
    name: ollama-network

volumes:
  open-webui:
    driver: local

services:
  # LiteLLM Proxy - Standard OpenAI-compatible gateway to Ollama and Cloud Models
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    networks:
      - ollama-network
    ports:
      - "4000:4000"
    volumes:
      - ./docker/litellm_config.yaml:/app/config.yaml
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OPENROUTER_KEY=${OPENROUTER_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_MODEL_ID=${OPENROUTER_MODEL_ID:-z-ai/glm-4.5-air:free}
      - OPENAI_MODEL_ID=${OPENAI_MODEL_ID:-gpt-4o-mini}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    restart: unless-stopped

  # Hubitat Strands Agent with AG-UI, A2UI, and AgentSkills
  hubitat-agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    image: hubitat-agent:latest
    container_name: hubitat-agent
    env_file: 
      - .env
    depends_on:
      - hubitat-mcp
      - duckduckgo-mcp
      - litellm
    networks:
      - ollama-network
    ports:
      - "9002:9002"
    environment:
      - MCP_SERVER_HOST=hubitat-mcp
      - MCP_PORT=8888
      - DDG_MCP_HOST=duckduckgo-mcp
      - DDG_MCP_PORT=7070
      - LITELLM_URL=http://litellm:4000/v1
      - LITELLM_API_KEY=sk-home-agent-litellm-key
      - LITELLM_MODEL=default-model
      - AGENT_HOST=0.0.0.0
      - AGENT_PORT=9002
      - SKILLS_DIR=/app/skills/controlling-hubitat
    volumes:
      - ./services/agent:/app/services/agent
      - ./skills:/app/skills
    restart: unless-stopped

  # Hubitat Maker API MCP Server
  hubitat-mcp:
    image: coatsnmore/hubitat-mcp:0.0.3
    container_name: hubitat-mcp
    env_file:
      - .env
    networks:
      - ollama-network
    ports:
      - "8888:8888"
    environment:
      - HOST=${HUB_HOST}
      - ACCESS_TOKEN=${HUB_ACCESS_TOKEN}
      - MCP_PORT=8888
      - FAST_MCP_LOG_LEVEL=ERROR
      - LOG_LEVEL=ERROR
    command: ["--http-only"]
    restart: unless-stopped

  # DuckDuckGo Internet Search MCP Server
  duckduckgo-mcp:
    build:
      context: .
      dockerfile: docker/duckduckgo.Dockerfile
    image: duckduckgo-mcp:latest
    container_name: duckduckgo-mcp
    networks:
      - ollama-network
    ports:
      - "7070:7070"
    restart: unless-stopped

  # Modern React + Vite Web Dashboard
  home-page:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: home-web:latest
    container_name: home-page
    depends_on:
      - hubitat-agent
    networks:
      - ollama-network
    ports:
      - "5173:5173"
    environment:
      - VITE_AGENT_PROXY=http://hubitat-agent:9002
      - VITE_MCP_PROXY=http://hubitat-mcp:8888
    volumes:
      - ./services/web:/app/services/web
      - /app/services/web/node_modules
    restart: unless-stopped

  # SSL Reverse Proxy (Nginx)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: nginx-ssl:dev
    container_name: nginx-ssl
    depends_on:
      - hubitat-agent
      - hubitat-mcp
      - home-page
    networks:
      - ollama-network
    ports:
      - "80:80"    # HTTP - redirects to HTTPS
      - "443:443"   # HTTPS - main entry point
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot:/var/www/certbot:ro
    restart: unless-stopped

  # Open WebUI (Optional UI)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    pull_policy: always
    networks:
      - ollama-network
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    restart: unless-stopped