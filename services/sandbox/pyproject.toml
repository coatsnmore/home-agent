[project]
name = "home-code-sandbox"
version = "0.1.0"
description = "Sandboxed code execution sidecar for Home Agent programmatic tool calling"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "httpx[http2]>=0.27.0",
    "requests>=2.32.4",
    "aiohttp>=3.10.0",
    "pandas>=2.2.0",
    "jmespath>=1.0.1",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "trafilatura>=1.12.0",
    "tabulate>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "sdk"]
