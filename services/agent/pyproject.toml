[project]
name = "home-agent"
version = "0.3.0"
description = "Universal Home Agent with Strands, AG-UI, A2UI, and LiteLLM"
requires-python = ">=3.12"

dependencies = [
    "strands-agents[ollama,openai]>=1.55.1",
    "openai>=1.50.0",
    "ag-ui-protocol>=0.1.22",
    "ag-ui-strands>=0.4.0",
    "ag-ui-a2ui-toolkit>=0.0.4",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "mcp>=1.14.0",
    "requests>=2.32.4",
    "httpx>=0.27.0",
]

[project.scripts]
home-agent = "src.main:main"
hubitat-agent = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
